# Keeps Formula/secretsbot.rb and Casks/secretsbot.rb at the latest secretsbot
# release (https://github.com/ricardodantas/secretsbot), with no token of
# another repository: it reads the public release and commits here with this
# workflow's own GITHUB_TOKEN. .github/scripts/update-secretsbot.sh does the
# checks (checksums, Linux build provenance, macOS signatures and
# notarization) and renders both files; nothing changes until the release's
# signed macOS files are attached. secretsbot's
# packaging/macos/sign-and-notarize-release.sh starts this workflow when they
# are; the schedule catches anything missed.
name: Update secretsbot

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "secretsbot release tag (vX.Y.Z); empty for the latest release"
        required: false
        default: ""

permissions: {}

concurrency:
  group: update-secretsbot
  cancel-in-progress: false

jobs:
  update:
    name: secretsbot formula and cask
    # macOS: the signature checks and `brew audit --cask` need it.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      # Commit the rendered formula and cask.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the release and render the formula and cask
        id: render
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: .github/scripts/update-secretsbot.sh
      - name: Audit
        if: steps.render.outputs.changed == 'true'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail
          taps="$(brew --repository)/Library/Taps/ricardodantas"
          mkdir -p "$taps"
          ln -sfn "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew style ricardodantas/tap/secretsbot
          brew audit --strict --formula ricardodantas/tap/secretsbot
          brew style --cask ricardodantas/tap/secretsbot
          brew audit --strict --cask ricardodantas/tap/secretsbot
      - name: Commit
        if: steps.render.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          set -euo pipefail
          git add Formula/secretsbot.rb Casks/secretsbot.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "secretsbot: update to v$VERSION"
          git push
